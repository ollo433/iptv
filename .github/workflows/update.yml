name: Update IPTV playlist

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download playlist
        run: |
          curl -L --fail \
            "https://dearbulut.github.io/iptv/playlists/country/ua.m3u" \
            -o source.m3u

      - name: Create simple T62D playlist
        run: |
          python3 - <<'PY'
          import re

          with open("source.m3u", "r", encoding="utf-8") as f:
              lines = f.read().splitlines()

          result = ["#EXTM3U"]

          for line in lines:
              line = line.strip()

              if line.startswith("#EXTINF:"):
                  result.append(line)
              elif re.match(r"^https?://", line):
                  result.append(line)

          with open("ua.m3u", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(result) + "\n")
          PY

      - name: Check playlist
        run: |
          test -s ua.m3u
          grep -q "^#EXTM3U" ua.m3u
          echo "Channels:"
          grep -c "^#EXTINF:" ua.m3u
          echo "URLs:"
          grep -c "^https\?://" ua.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ua.m3u
          git diff --cached --quiet || git commit -m "Update IPTV playlist"
          git push
