name: Update IPTV playlist

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download playlist
        run: |
          curl -L --fail \
            "https://dearbulut.github.io/iptv/playlists/country/ua.m3u" \
            -o ua.m3u

      - name: Check playlist
        run: |
          test -s ua.m3u
          grep -q "^#EXTM3U" ua.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ua.m3u
          git diff --cached --quiet || git commit -m "Update IPTV playlist"
          git push
